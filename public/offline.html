<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16A34A">
  <title>Gruwcer — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F5F7;
      padding: 24px;
    }
    .container { text-align: center; max-width: 320px; }
    .icon {
      width: 80px; height: 80px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .icon svg { width: 40px; height: 40px; color: #16A34A; }
    h1 { font-size: 20px; font-weight: 800; color: #1a1a2e; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #16A34A; color: white; border: none;
      padding: 12px 32px; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .brand { margin-top: 40px; font-size: 13px; color: #9ca3af; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.243 4.243a1 1 0 010-1.414" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection detected. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="brand">Gruwcer</p>
  </div>
</body>
</html>
